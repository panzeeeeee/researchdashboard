name: 한국 스크리너

on:
  schedule:
    # UTC 기준입니다. 한국시간 평일 저녁 6시 50분 -- 코스피·코스닥 마감(15:30) 뒤 주가가 야후에 반영된 다음.
    - cron: "50 9 * * 1-5"
  workflow_dispatch:
    inputs:
      limit:
        description: "시험용: 종목을 이 개수만 (0이면 전체)"
        default: "0"
      force:
        description: "장 마감 전에도 돌리기 (1이면 강제)"
        default: ""

permissions:
  contents: write

concurrency:
  # 다른 갱신 작업과 같은 줄에 세워, 동시에 커밋하다 부딪히지 않게 한다
  group: news
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 가격 캐시 복원
        uses: actions/cache@v4
        with:
          path: screener/kr_px_cache.pkl.gz
          key: kr-px-cache-${{ github.run_id }}
          restore-keys: kr-px-cache-

      - name: 한국 신고가 스크리너
        env:
          KR_FORCE: ${{ inputs.force }}
        run: python scripts/kr_breakout.py -w screener --limit ${{ inputs.limit || 0 }}

      - name: 결과 커밋
        run: |
          git config user.name "dashboard-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/data
          git diff --staged --quiet && exit 0
          git commit -m "한국 스크리너 갱신 $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
