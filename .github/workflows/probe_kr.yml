name: 한국 스크리너 자료원 시험

on:
  workflow_dispatch:        # 손으로만 돌리는 시험용. 아무 파일도 저장하지 않습니다.
    inputs:
      only:
        description: "dartfin = DART 재무제표 응답 구조, chart = 네이버 차트, sample = 무작위 표본 히스토리. 비우면 전부"
        default: "dartfin"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 자료원 시험 (네이버 금융·KIND·DART·야후)
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          PROBE_ONLY: ${{ inputs.only }}
        run: python scripts/probe_kr_sources.py
