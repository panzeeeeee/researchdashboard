name: 한국 스크리너 자료원 시험

on:
  workflow_dispatch:        # 손으로만 돌리는 시험용. 아무 파일도 저장하지 않습니다.
    inputs:
      only:
        description: "syntax = 파이썬 문법 검사(빠름), overview = 네이버 기업개요, ecos2, ecos, dartidx, dartfin, chart, sample"
        default: "syntax"

permissions:
  contents: write           # 시험 결과 파일(probe_out/latest.txt)을 저장소에 올려 로그를 대신 읽을 수 있게

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"      # 파이썬 출력을 모아두지 않고 바로바로 로그에 보이게
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 자료원 시험 (네이버 금융·KIND·DART·야후)
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          PROBE_ONLY: ${{ inputs.only }}
        run: |
          mkdir -p probe_out
          python scripts/probe_kr_sources.py 2>&1 | tee probe_out/latest.txt

      - name: 결과 파일 올리기
        run: |
          git config user.name "dashboard-bot"
          git config user.email "bot@users.noreply.github.com"
          git add probe_out
          if [ -e screener/dart_corp_codes.json ]; then git add screener/dart_corp_codes.json; fi
          git diff --staged --quiet && exit 0
          git commit -m "자료원 시험 결과 $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
