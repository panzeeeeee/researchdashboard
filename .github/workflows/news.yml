name: 대시보드 갱신

on:
  schedule:
    # UTC 기준입니다. 한국시간 평일 아침 8시와 저녁 6시 반, 하루 두 번.
    # 스크리너가 2,000종목을 훑기 때문에 매시간 돌리지 않습니다.
    - cron: "0 23 * * 0-4"
    - cron: "30 9 * * 1-5"
  workflow_dispatch:        # 저장소 Actions 탭에서 손으로도 돌릴 수 있습니다

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 가격 캐시 복원
        uses: actions/cache@v4
        with:
          path: screener/us_px_cache.pkl.gz
          key: px-cache-${{ github.run_id }}
          restore-keys: px-cache-

      - name: 신고가 스크리너
        run: python scripts/us_breakout.py -w screener -u SPX NDX R2K

      - name: US 섹터 브레드스
        # 신고가 스크리너가 만든 가격 캐시를 아직 디스크에 있을 때 읽는다
        run: python scripts/fetch_sector_breadth.py
        continue-on-error: true

      - name: 재무 캐시 복원
        uses: actions/cache@v4
        with:
          path: dv_cache
          key: dv-cache-${{ github.run_id }}
          restore-keys: dv-cache-

      - name: 종목 목록 넘겨주기
        # 딥밸류가 러셀2000 목록을 직접 못 읽는 문제가 있어,
        # 신고가 스크리너가 이미 받아둔 목록을 재활용합니다.
        run: python scripts/bridge_universe.py
        continue-on-error: true

      - name: 딥밸류 스크리너
        # 지수별로 따로 돌립니다. 하나가 실패해도 나머지는 진행됩니다.
        run: |
          DV="python scripts/deepvalue/dv_run.py --out screener/outputs"
          $DV --universe ndx || echo "NDX 실패"
          $DV --universe spx || echo "SPX 실패"
          $DV --universe r2k \
            --universe-file screener/universe_cache/dv_r2k.csv || echo "R2K 실패"
        continue-on-error: true

      - name: 오늘의 종목 선정
        run: python scripts/make_picks.py

      - name: 포트폴리오 갱신
        # 스크리너가 수천 종목을 긁은 직후라 야후가 막을 수 있어 잠시 쉰다
        run: |
          sleep 45
          python scripts/fetch_portfolio.py
        continue-on-error: true

      - name: 미국 시장 현황
        # 포트폴리오 직후라 야후 쪽에 한 번 더 여유를 둔다
        run: |
          sleep 20
          python scripts/fetch_market.py
        continue-on-error: true

      - name: 글로벌 유동성
        # FRED 공개 데이터라 야후 딜레이는 필요 없다
        run: python scripts/fetch_liquidity.py
        continue-on-error: true

      - name: 자금시장 상세
        run: python scripts/fetch_money_market.py
        continue-on-error: true

      - name: 유동성 해설
        # 위 두 단계가 만든 파일을 읽는다 — 반드시 이 순서 뒤에 와야 한다
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/fetch_liquidity_notes.py
        continue-on-error: true

      - name: 8-K 실적 공시 수집
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python scripts/fetch_edgar.py
        continue-on-error: true

      - name: 컨콜 흐름 수집
        env:
          EQUIBLES_API_KEY: ${{ secrets.EQUIBLES_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/fetch_calls.py
        continue-on-error: true

      - name: 결과 표 생성
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/make_tables.py

      - name: 뉴스 수집
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/fetch_news.py

      - name: 리포트 링크 수집
        run: python scripts/fetch_research.py

      - name: 텔레그램 발송
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/push_telegram.py

      - name: 결과 커밋
        run: |
          git config user.name "dashboard-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/data
          git diff --staged --quiet || git commit -m "뉴스 갱신 $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
