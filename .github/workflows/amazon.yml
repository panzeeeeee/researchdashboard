name: 센텔리안24 아마존

on:
  schedule:
    # UTC 기준입니다. 한국시간 매일 아침 7시 반, 하루 한 번.
    # 아마존 시트 + 수출입 통계를 받습니다. 새 자료가 없으면 그대로 둡니다.
    - cron: "30 22 * * *"
  workflow_dispatch:        # 저장소 Actions 탭에서 손으로도 돌릴 수 있습니다

permissions:
  contents: write

concurrency:
  # 대시보드 갱신(news.yml)과 같은 줄에 세워, 둘이 동시에 커밋하다 부딪히지 않게 한다
  group: news
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 시트 읽기 → 패널 데이터·이력 갱신
        run: python scripts/fetch_amazon.py
        continue-on-error: true

      - name: 수출입 통계 (관세청)
        # 처음 한 번은 2023년부터 전부 받아서 10~20분 걸릴 수 있다.
        # 이후엔 새 달이 없으면 금방 끝난다.
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: |
          pip install pyyaml
          python scripts/fetch_trade.py
        continue-on-error: true

      - name: 결과 커밋
        run: |
          git config user.name "dashboard-bot"
          git config user.email "bot@users.noreply.github.com"
          for f in docs/data/amazon.json docs/data/trade.json history; do
            if [ -e "$f" ]; then git add "$f"; fi
          done
          git diff --staged --quiet && exit 0
          git commit -m "아마존·수출입 갱신 $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
