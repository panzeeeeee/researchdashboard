name: 아마존·수출입·배너

on:
  schedule:
    # UTC 기준입니다. 한국시간 아침 7시 반, 저녁 6시.
    # 배너(금리·유가·환율)는 두 번 다 갱신. 아마존·수출입은 새 자료가 없으면 그대로 둡니다.
    - cron: "30 22 * * *"
    - cron: "0 9 * * *"
  workflow_dispatch:        # 저장소 Actions 탭에서 손으로도 돌릴 수 있습니다

permissions:
  contents: write

concurrency:
  # 대시보드 갱신(news.yml)과 같은 줄에 세워, 둘이 동시에 커밋하다 부딪히지 않게 한다
  group: news
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 머리말 배너 (금리·유가·환율)
        run: python scripts/fetch_banner.py
        continue-on-error: true

      - name: 시트 읽기 → 패널 데이터·이력 갱신
        run: python scripts/fetch_amazon.py
        continue-on-error: true

      - name: 수출입 통계 (관세청)
        # 새 달이 없으면 금방 끝난다. 새 달·7일 경과·빠진 나라가 있을 때만 다시 받는다.
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: |
          pip install pyyaml
          python scripts/fetch_trade.py
        continue-on-error: true

      - name: 미국 실적 레이더 (SEC 8-K)
        # 최근 40시간 안에 접수된 실적 공시를 모은다. 이미 받은 건 건너뛴다.
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python scripts/fetch_earnings.py
        continue-on-error: true

      - name: 결과 커밋
        run: |
          git config user.name "dashboard-bot"
          git config user.email "bot@users.noreply.github.com"
          # docs/data 폴더 전체를 올린다 -- 새 화면용 파일이 생겨도 여기를 고칠 필요 없음
          git add docs/data
          if [ -e history ]; then git add history; fi
          git diff --staged --quiet && exit 0
          git commit -m "배너·아마존·수출입 갱신 $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
