<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>리서치 콘솔</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --paper:#fbfbf9; --card:#fff; --ink:#16191c; --ink-2:#5b6269; --ink-3:#8d949b;
  --rule:#e3e4e0; --accent:#0f6e56; --tintA:#eef4f1; --up:#1d7a4a; --down:#b3332e;
}
@media (prefers-color-scheme: dark){
  :root{ --paper:#14161a; --card:#1b1e23; --ink:#e8e9e6; --ink-2:#a2a8ae; --ink-3:#767c83;
         --rule:#2a2e34; --accent:#5dcaa5; --tintA:#1d2a26; --up:#5dc48a; --down:#e78078; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:Pretendard,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:2rem 1.25rem 4rem}
.layout{display:grid;grid-template-columns:172px minmax(0,1fr);gap:2rem;align-items:start}
nav{position:sticky;top:2rem}
nav a{display:block;font-size:.84rem;color:var(--ink-2);text-decoration:none;
  padding:.4rem .6rem;border-radius:7px;border-left:2px solid transparent}
nav a:hover{background:var(--card);color:var(--ink)}
nav a.on{color:var(--accent);border-left-color:var(--accent);
  background:var(--tintA);font-weight:600}
nav .count{float:right;color:var(--ink-3);font-size:.74rem;font-weight:400}
nav .divider{height:1px;background:var(--rule);margin:.6rem .6rem}
main section{display:none}
main section.on{display:block}
main section h2{margin-bottom:1.1rem}
@media (max-width:760px){
  .layout{grid-template-columns:1fr;gap:1rem}
  nav{position:static;display:flex;gap:.3rem;overflow-x:auto;
    padding-bottom:.4rem;border-bottom:1px solid var(--rule)}
  nav a{white-space:nowrap;border-left:none;border-bottom:2px solid transparent;
    border-radius:0;padding:.35rem .5rem}
  nav a.on{border-left:none;border-bottom-color:var(--accent);background:none}
  nav .count,nav .divider{display:none}
}
header{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;
  flex-wrap:wrap;border-bottom:1px solid var(--rule);padding-bottom:.9rem;margin-bottom:2rem}
h1{font-size:1.25rem;font-weight:600;margin:0;letter-spacing:-.01em}
.meta{font-size:.8rem;color:var(--ink-3);font-variant-numeric:tabular-nums}
h2{font-size:.95rem;font-weight:600;margin:0 0 1rem;letter-spacing:-.005em}
section{margin-bottom:2.75rem}
.group{border-top:1px solid var(--rule);padding:1.15rem 0}
.group:first-of-type{border-top:none;padding-top:0}
.ghead{display:flex;align-items:center;gap:.5rem;margin-bottom:.7rem;flex-wrap:wrap}
.gname{font-size:.95rem;font-weight:600}
.tag{font-size:.78rem;font-weight:600;color:var(--accent)}
.pill{font-size:.68rem;color:var(--ink-3);border:1px solid var(--rule);
  border-radius:999px;padding:.05rem .45rem}
.pill.on{color:var(--accent);border-color:var(--accent);background:var(--tintA)}
article{padding:.42rem 0}
article a{color:var(--ink);text-decoration:none;font-size:.92rem;
  border-bottom:1px solid transparent}
article a:hover,article a:focus-visible{border-bottom-color:var(--accent);color:var(--accent)}
.sum{font-size:.82rem;color:var(--ink-2);margin:.12rem 0 0}
.src{font-size:.72rem;color:var(--ink-3);font-variant-numeric:tabular-nums}
.more{margin-top:.5rem;background:none;border:1px solid var(--rule);color:var(--ink-2);
  border-radius:999px;padding:.22rem .8rem;font-size:.76rem;cursor:pointer;
  font-family:inherit}
.more:hover{border-color:var(--accent);color:var(--accent)}
.hidden{display:none}
.reports{background:var(--card);border:1px solid var(--rule);border-radius:9px;
  padding:.7rem .9rem;margin-top:.7rem}
.reports .cap{font-size:.72rem;color:var(--ink-3);margin:0 0 .35rem}
.reports article{padding:.28rem 0}
.reports a{font-size:.86rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:.75rem}
.slot{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:1rem}
.slot h3{font-size:.85rem;font-weight:600;margin:0 0 .3rem}
.slot p{font-size:.78rem;color:var(--ink-3);margin:0}
.note{font-size:.82rem;color:var(--ink-3)}
table{width:100%;border-collapse:collapse;font-size:.82rem;
  font-variant-numeric:tabular-nums}
th{text-align:left;font-weight:500;color:var(--ink-3);font-size:.72rem;
  padding:.3rem .4rem;border-bottom:1px solid var(--rule);white-space:nowrap}
td{padding:.34rem .4rem;border-bottom:1px solid var(--rule)}
td.n,th.n{text-align:right}
tr:last-child td{border-bottom:none}
.tick{font-weight:600}
.hit{color:var(--accent);font-weight:600}
.miss{color:var(--ink-3);font-size:.74rem}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.sub{font-size:.8rem;font-weight:600;margin:1.3rem 0 .5rem}
.sub:first-child{margin-top:0}
.up{color:var(--up)}
.down{color:var(--down)}
.slot .cap{font-size:.74rem;color:var(--ink-3);margin:0 0 .25rem}
.slot .big{font-size:1.35rem;font-weight:600;margin:0 0 .2rem;
  font-variant-numeric:tabular-nums}
.slot .big.hit{color:var(--accent)}
.slot .miss{margin:0}
.adder{background:var(--card);border:1px solid var(--rule);border-radius:10px;
  padding:.9rem 1rem;margin-top:1.4rem}
.adder .row{display:flex;gap:.5rem;flex-wrap:wrap}
.adder input{flex:1;min-width:140px;font:inherit;font-size:.86rem;
  padding:.4rem .6rem;border:1px solid var(--rule);border-radius:7px;
  background:var(--paper);color:var(--ink);text-transform:uppercase}
.adder input:focus{outline:none;border-color:var(--accent)}
.adder button{font:inherit;font-size:.82rem;padding:.4rem .9rem;cursor:pointer;
  border-radius:7px;border:1px solid var(--accent);background:var(--accent);
  color:#fff}
.adder button.ghost{background:none;color:var(--accent)}
.adder pre{background:var(--paper);border:1px solid var(--rule);border-radius:7px;
  padding:.6rem .7rem;margin:.7rem 0 .5rem;font-size:.8rem;overflow-x:auto;
  white-space:pre;font-family:var(--font-mono,ui-monospace,monospace)}
.adder a{color:var(--accent);font-size:.82rem}
.chips{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.5rem}
.chip{font-size:.72rem;color:var(--ink-2);background:var(--card);
  border:1px solid var(--rule);border-radius:999px;padding:.12rem .55rem}
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>리서치 콘솔</h1>
  <span class="meta" id="stamp">불러오는 중</span>
</header>

<div class="layout">

<nav id="nav">
  <a href="#picks" class="on">오늘의 종목 <span class="count" id="c-picks"></span></a>
  <a href="#portfolio">포트폴리오</a>
  <a href="#breakout">신고가 · 물극필반</a>
  <a href="#deepvalue">딥밸류</a>
  <a href="#news">섹터 뉴스 <span class="count" id="c-news"></span></a>
  <div class="divider"></div>
  <a href="#soon">준비 중</a>
</nav>

<main>

<section id="picks" class="on">
  <h2>오늘의 종목</h2>
  <div id="stocks"><p class="note">불러오는 중입니다.</p></div>
</section>

<section id="portfolio">
  <h2>포트폴리오 · 룰 트리거</h2>
  <div id="pf"><p class="note">불러오는 중입니다.</p></div>
</section>

<section id="breakout">
  <h2>신고가 · 물극필반</h2>
  <div id="t-breakout"><p class="note">불러오는 중입니다.</p></div>
</section>

<section id="deepvalue">
  <h2>딥밸류</h2>
  <div id="t-deepvalue"><p class="note">불러오는 중입니다.</p></div>
</section>

<section id="news">
  <h2>섹터 뉴스</h2>
  <div id="sectors"><p class="note">불러오는 중입니다.</p></div>
</section>

<section id="soon">
  <h2>준비 중인 패널</h2>
  <div class="grid">
    <div class="slot"><h3>관심종목 수급</h3><p>외국인·기관 20일 누적</p></div>
    <div class="slot"><h3>K-뷰티 수출 레이더</h3><p>관세청 순별 통계</p></div>
  </div>
</section>

</main>
</div>
</div>

<script>
const SHOW = 5;   // 처음 보여줄 건수. 나머지는 더보기로 펼친다

const esc = s => String(s ?? "").replace(/[&<>"]/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const ago = iso => {
  if (!iso) return "";
  const h = (Date.now() - new Date(iso)) / 36e5;
  if (h < 1) return "방금";
  if (h < 24) return Math.round(h) + "시간 전";
  return Math.round(h / 24) + "일 전";
};

const newsItem = (it, i) => `
  <article class="${i < SHOW ? "" : "extra hidden"}">
    <a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title)}</a>
    ${it.summary ? `<p class="sum">${esc(it.summary)}</p>` : ""}
    <span class="src">${esc(it.source)} · ${ago(it.published)}${
      it.dup_count ? " · 유사 " + it.dup_count : ""}</span>
  </article>`;

const moreBtn = n => n > SHOW
  ? `<button class="more" data-rest="${n - SHOW}">더보기 ${n - SHOW}건</button>` : "";

const reportBlock = rows => !rows || !rows.length ? "" : `
  <div class="reports">
    <p class="cap">리포트 · 목표주가</p>
    ${rows.map(r => `
      <article>
        <a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title)}</a>
        <span class="src">${esc(r.broker)}${r.date ? " · " + esc(r.date) : ""}</span>
      </article>`).join("")}
  </div>`;

function bindMore(root) {
  root.querySelectorAll(".more").forEach(btn => {
    btn.addEventListener("click", () => {
      const box = btn.closest(".group");
      box.querySelectorAll(".extra").forEach(el => el.classList.remove("hidden"));
      btn.remove();
    });
  });
}

const nz = v => (v === null || v === undefined || v === "") ? "—" : v;

function renderTables(t) {
  const bBox = document.getElementById("t-breakout");
  const dBox = document.getElementById("t-deepvalue");
  if (!t) {
    const msg = '<p class="note">tables.json 이 아직 없습니다.</p>';
    bBox.innerHTML = msg; dBox.innerHTML = msg; return;
  }

  const bo = (t.breakout || []).map(r => `
    <tr>
      <td class="tick">${esc(r.code)}</td>
      <td>${esc((r.name || "").slice(0, 24))}</td>
      <td>${esc(r.universe || "")}</td>
      <td class="n">${nz(r.score)}</td>
      <td class="n">${r.gates >= 3 ? `<span class="hit">${r.gates}</span>` : nz(r.gates)}</td>
      <td class="n">${r.drawdown ? r.drawdown + "%" : '<span class="miss">해당없음</span>'}</td>
      <td class="miss">${esc(r.missing || "—")}</td>
    </tr>`).join("");

  const hist = (t.history || []).slice(-12);

  bBox.innerHTML = `
    <p class="sub">오늘 신고가 <span class="miss">게이트 3개 이상이 후보</span></p>
    <div class="scroll"><table>
      <tr><th>티커</th><th>종목</th><th>지수</th><th class="n">점수</th>
          <th class="n">게이트</th><th class="n">낙폭</th><th>못 넘은 항목</th></tr>
      ${bo || '<tr><td colspan="7" class="note">해당 없음</td></tr>'}
    </table></div>

    <p class="sub">통과 추이</p>
    <div class="scroll"><table>
      <tr><th>날짜</th><th class="n">신고가</th><th class="n">게이트3+</th>
          <th class="n">매수가능</th></tr>
      ${hist.map(x => `<tr><td>${esc(x.date.slice(5))}</td>
        <td class="n">${x.highs}</td><td class="n">${x.gate3}</td>
        <td class="n">${x.buyable}</td></tr>`).join("")
        || '<tr><td colspan="4" class="note">기록 없음</td></tr>'}
    </table></div>`;

  const dv = (t.deepvalue || []).map(r => `
    <tr>
      <td class="tick">${esc(r.code)}${r.triggered ? ' <span class="hit">•</span>' : ""}</td>
      <td>${esc((r.name || "").slice(0, 24))}</td>
      <td>${esc(r.universe || "")}</td>
      <td class="n">${nz(r.score)}</td>
      <td class="n">${nz(r.fscore)}</td>
      <td class="n">${nz(r.drawdown)}%</td>
      <td class="n">${nz(r.below200)}</td>
      <td class="miss">${esc(r.why || "—")}</td>
    </tr>`).join("");

  const chips = (t.rejects || []).slice(0, 8)
    .map(([k, v]) => `<span class="chip">${esc(k)} ${v}</span>`).join("");

  dBox.innerHTML = `
    <p class="sub">후보 <span class="miss">• 는 오늘 트리거 발생</span></p>
    <div class="scroll"><table>
      <tr><th>티커</th><th>종목</th><th>지수</th><th class="n">점수</th><th class="n">F</th>
          <th class="n">낙폭</th><th class="n">200일선아래</th><th>왜 싼가</th></tr>
      ${dv || '<tr><td colspan="8" class="note">해당 없음</td></tr>'}
    </table></div>

    <p class="sub">트리거 추이</p>
    <div class="scroll"><table>
      <tr><th>날짜</th><th class="n">후보</th><th class="n">트리거</th></tr>
      ${hist.map(x => `<tr><td>${esc(x.date.slice(5))}</td>
        <td class="n">${x.dv_candidates}</td>
        <td class="n">${x.dv_triggered}</td></tr>`).join("")
        || '<tr><td colspan="3" class="note">기록 없음</td></tr>'}
    </table></div>

    <p class="sub">다 걸러낸 조건</p>
    <div class="chips">${chips || '<span class="note">집계 없음</span>'}</div>`;
}

Promise.all([
  fetch("data/news.json?t=" + Date.now()).then(r => r.json()),
  fetch("data/research.json?t=" + Date.now()).then(r => r.json()).catch(() => null),
  fetch("data/tables.json?t=" + Date.now()).then(r => r.json()).catch(() => null),
  fetch("data/portfolio.json?t=" + Date.now()).then(r => r.json()).catch(() => null),
]).then(([news, research, tables, pf]) => {
  renderTables(tables);
  renderPortfolio(pf);
  document.getElementById("stamp").textContent =
    new Date(news.updated_at).toLocaleString("ko-KR",
      { month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" })
    + " · " + news.total + "건";

  const byCode = {};
  (research?.stocks || []).forEach(s => { byCode[s.code] = s.items; });

  const stockBox = document.getElementById("stocks");
  const stocks = (news.stocks || []).filter(s => s.items.length || byCode[s.code]?.length);
  stockBox.innerHTML = stocks.length ? stocks.map(s => `
    <div class="group">
      <div class="ghead">
        <span class="gname">${esc(s.name)}</span>
        <span class="pill">${esc(s.code)}</span>
        ${s.source ? `<span class="pill on">${esc(s.source)}</span>` : ""}
        ${s.note ? `<span class="pill">${esc(s.note)}</span>` : ""}
      </div>
      ${s.items.map(newsItem).join("")}
      ${moreBtn(s.items.length)}
      ${reportBlock(byCode[s.code])}
    </div>`).join("")
    : '<p class="note">picks.json 이 비어 있습니다. Actions 에서 수집을 한 번 실행하세요.</p>';

  const sectorBox = document.getElementById("sectors");
  const live = (news.sectors || []).filter(s => s.items.length);
  sectorBox.innerHTML = live.length ? live.map(s => `
    <div class="group">
      <div class="ghead">
        <span class="tag">${esc(s.name)}</span>
        ${s.push ? '<span class="pill">알림</span>' : ""}
      </div>
      ${s.items.map(newsItem).join("")}
      ${moreBtn(s.items.length)}
    </div>`).join("")
    : '<p class="note">최근 기사가 없습니다. 검색어를 넓혀 보세요.</p>';

  const cp = document.getElementById("c-picks");
  const cn = document.getElementById("c-news");
  if (cp) cp.textContent = stocks.length || "";
  if (cn) cn.textContent = news.total || "";

  bindMore(document);
  setupNav();
}).catch(() => {
  document.getElementById("stamp").textContent = "데이터 없음";
  document.getElementById("stocks").innerHTML =
    '<p class="note">data/news.json 을 찾지 못했습니다. Actions 탭에서 수집을 실행하세요.</p>';
  document.getElementById("sectors").innerHTML = "";
  setupNav();
});

// 사이드바로 페이지를 전환한다. 한 번에 한 화면만 보여준다.
function setupNav() {
  const links = [...document.querySelectorAll("nav a")];
  const show = id => {
    const target = document.getElementById(id) ? id : "picks";
    document.querySelectorAll("main section").forEach(s =>
      s.classList.toggle("on", s.id === target));
    links.forEach(a =>
      a.classList.toggle("on", a.getAttribute("href") === "#" + target));
    window.scrollTo(0, 0);
  };

  links.forEach(a => a.addEventListener("click", e => {
    e.preventDefault();
    const id = a.getAttribute("href").slice(1);
    if (location.hash !== "#" + id) history.pushState(null, "", "#" + id);
    show(id);
  }));

  // 뒤로가기와 새로고침에서도 보던 화면이 유지되도록
  window.addEventListener("popstate", () =>
    show(location.hash.slice(1) || "picks"));
  show(location.hash.slice(1) || "picks");
}

const fmtMoney = v => v === null || v === undefined ? "—" : v.toLocaleString();
const signed = v => {
  if (v === null || v === undefined) return '<span class="miss">—</span>';
  const cls = v > 0 ? "up" : v < 0 ? "down" : "";
  return `<span class="${cls}">${v > 0 ? "+" : ""}${v}%</span>`;
};

function renderPortfolio(p) {
  const box = document.getElementById("pf");
  if (!p) { box.innerHTML = '<p class="note">portfolio.json 이 아직 없습니다.</p>'; return; }

  const dd = p.benchmark_dd;
  const ladder = (p.ladder || []).map(l => `
    <div class="slot">
      <p class="cap">${esc(p.benchmark)} ${l.level}%</p>
      <p class="big ${l.hit ? "hit" : ""}">${l.hit ? "도달" : l.gap + "%p"}</p>
      <p class="miss">${l.hit ? "현금 투입 구간" : "남은 거리"}</p>
    </div>`).join("");

  const rows = (p.holdings || []).map(r => `
    <tr>
      <td class="tick">${esc(r.ticker)}</td>
      <td class="n">${fmtMoney(r.price)}</td>
      <td class="n">${signed(r.d1)}</td>
      <td class="n">${signed(r.m1)}</td>
      <td class="n">${signed(r.from_high)}</td>
      <td class="n">${r.pos52 === null ? "—" : r.pos52 + "%"}</td>
    </tr>`).join("");

  const have = new Set((p.holdings || []).map(r => r.ticker));

  box.innerHTML = `
    <p class="sub">${esc(p.benchmark)} 고점 대비 ${signed(dd)}</p>
    <div class="grid">${ladder || '<p class="note">트리거 설정 없음</p>'}</div>
    <p class="sub">보유 종목 <span class="miss">고점에서 많이 빠진 순</span></p>
    <div class="scroll"><table>
      <tr><th>종목</th><th class="n">종가</th><th class="n">1일</th>
          <th class="n">1개월</th><th class="n">고점대비</th><th class="n">52주위치</th></tr>
      ${rows || '<tr><td colspan="6" class="note">자료 없음</td></tr>'}
    </table></div>

    <div class="adder">
      <p class="cap">종목 추가</p>
      <div class="row">
        <input id="add-in" placeholder="티커 입력 (예: TSLA)" autocomplete="off">
        <button id="add-go">줄 만들기</button>
        <button id="add-clear" class="ghost">비우기</button>
      </div>
      <div id="add-out"></div>
    </div>`;

  setupAdder(have);
}

// 입력한 티커를 portfolio.yaml 에 붙여넣을 형태로 만들어 준다.
// 페이지가 저장소에 직접 쓸 수는 없으므로, 붙여넣기 한 번은 남는다.
function setupAdder(have) {
  const input = document.getElementById("add-in");
  const out = document.getElementById("add-out");
  if (!input || !out) return;

  const KEY = "pf-pending";
  const load = () => {
    try { return JSON.parse(localStorage.getItem(KEY) || "[]"); }
    catch { return []; }
  };
  const save = list => {
    try { localStorage.setItem(KEY, JSON.stringify(list)); } catch {}
  };

  // 페이지 주소에서 저장소 위치를 알아낸다 (USER.github.io/REPO/)
  const owner = location.hostname.split(".")[0];
  const repo = location.pathname.split("/").filter(Boolean)[0] || "";
  const editUrl = owner && repo
    ? `https://github.com/${owner}/${repo}/edit/main/config/portfolio.yaml`
    : null;

  const draw = () => {
    const list = load();
    if (!list.length) { out.innerHTML = ""; return; }
    const lines = list.map(t => `  - { ticker: "${t}" }`).join("\n");
    out.innerHTML = `
      <pre id="add-pre">${esc(lines)}</pre>
      <div class="row">
        <button id="add-copy" class="ghost">복사</button>
        ${editUrl ? `<a href="${editUrl}" target="_blank" rel="noopener"
           style="align-self:center">portfolio.yaml 편집 화면 열기 ↗</a>` : ""}
      </div>
      <p class="miss" style="margin-top:.5rem">
        holdings 목록 맨 아래에 붙여넣고 Commit 하세요. 다음 실행부터 반영됩니다.</p>`;

    document.getElementById("add-copy").addEventListener("click", e => {
      navigator.clipboard?.writeText(lines).then(() => {
        e.target.textContent = "복사됨";
        setTimeout(() => (e.target.textContent = "복사"), 1500);
      });
    });
  };

  const add = () => {
    const t = (input.value || "").trim().toUpperCase();
    if (!t) return;
    if (!/^[A-Z0-9.\-]{1,10}$/.test(t)) {
      out.innerHTML = '<p class="miss">티커 형식이 아닙니다.</p>';
      return;
    }
    if (have.has(t)) {
      out.innerHTML = `<p class="miss">${esc(t)} 는 이미 보유 목록에 있습니다.</p>`;
      input.value = "";
      return;
    }
    const list = load();
    if (!list.includes(t)) list.push(t);
    save(list);
    input.value = "";
    draw();
  };

  document.getElementById("add-go").addEventListener("click", add);
  input.addEventListener("keydown", e => { if (e.key === "Enter") add(); });
  document.getElementById("add-clear").addEventListener("click", () => {
    save([]); draw();
  });
  draw();
}
</script>
</body>
</html>
